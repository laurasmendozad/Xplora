# Nombre de la aplicación
spring.application.name=xplora

# ----------------------------------------------------------
# Configuración de Logging (Log4j)
# ----------------------------------------------------------

# Nivel de log general
logging.level.root=INFO

# Configuración del logging para la web de Spring
logging.level.org.springframework.web=INFO

# Patrón de formato para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%highlight(%-5level)] [%cyan(%thread)] %magenta(%logger{15}) - %msg%n

# Configuración de Log4j
log4j.rootLogger=INFO,stdout,file

# Appender de la consola (salida estándar)
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] [ %-5p] [%c{1}:%L] %m%n

# Appender de archivo (log en archivo)
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logfile.log
log4j.appender.file.MaxFileSize=5MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] [ %-5p] [%c{1}:%L] %m%n

# ----------------------------------------------------------
# Configuración de JPA y Hibernate
# ----------------------------------------------------------

# Control del esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en la consola
spring.jpa.show-sql=true

# Formato para las consultas SQL
spring.jpa.properties.hibernate.format_sql=true

# (Opcional) Configuración del dialecto de MySQL, si es necesario
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ----------------------------------------------------------
# Configuración de la Base de Datos (MySQL)
# ----------------------------------------------------------

# URL de conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/Xplora_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true


# Driver para la conexión MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credenciales de la base de datos
spring.datasource.username=app_user
spring.datasource.password=root

# ----------------------------------------------------------
# Configuración de Perfiles
# ----------------------------------------------------------

# Activar el perfil para MySQL
spring.profiles.active=mysql

# ----------------------------------------------------------
# Configuración de JWT (JSON Web Token)
# ----------------------------------------------------------

# Clave secreta para firmar los JWT
app.jwtSecret=tu-secreto-aqui

# Tiempo de expiración del JWT en milisegundos (1 día)
app.jwtExpirationMs=86400000  # 1 día

spring.aot.enabled=false